server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: goti-server
  profiles:
    include:
      - integration
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      idle-timeout: 5000
      max-lifetime: 420000
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  config:
    import:
      - optional:file:.env[.properties]

jwt:
  secret: ${JWT_SECRET_KEY}
  access-valid-time: ${JWT_ACCESS_TIME}
  refresh-valid-time: ${JWT_REFRESH_TIME}
  social-verify-valid-time: ${JWT_SOCIAL_VERIFY_TIME:300000}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0  # dev 전수 — EKS에서는 SPRING_PROFILES_ACTIVE=prod → 0.1

otel:
  exporter:
    otlp:
      enabled: ${OTEL_EXPORTER_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_ENDPOINT:http://localhost:4318}
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]"

seat:
  hold:
    ttl: 10m
  lock:
    wait-seconds: 1
  hold-expiry:
    enabled: true
    fixed-delay-ms: 1000
    batch-size: 200
