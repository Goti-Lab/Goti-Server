# EKS 환경 전용 — SPRING_PROFILES_ACTIVE=prod 로 활성화
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
        max-redirects: 3
      ssl:
        enabled: true
      timeout: 3000

management:
  tracing:
    sampling:
      probability: 0.1

otel:
  exporter:
    otlp:
      enabled: ${OTEL_EXPORTER_ENABLED:true}
      endpoint: ${OTEL_EXPORTER_ENDPOINT:http://alloy.monitoring.svc:4318}
  sdk:
    disabled: ${OTEL_SDK_DISABLED:false}
