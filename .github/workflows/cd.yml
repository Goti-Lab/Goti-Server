name: CD

on:
  push:
    branches: [deploy/dev]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: goti-server

jobs:
  # 모놀리식 ECR 이미지 빌드+push
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image
        run: |
          IMAGE_TAG="dev-${{ github.run_number }}-${GITHUB_SHA::7}"
          FULL_IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          if aws ecr describe-images --repository-name ${{ env.ECR_REPOSITORY }} --image-ids imageTag=${{ steps.image.outputs.tag }} > /dev/null 2>&1; then
            echo "이미지 ${{ steps.image.outputs.tag }} 이미 존재 — 빌드 스킵"
          else
            docker buildx build \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              --tag ${{ steps.image.outputs.full_image }} \
              --push \
              .
          fi

  # MSA 모듈별 ECR 이미지 빌드+push
  msa-image-build:
    runs-on: ubuntu-latest
    outputs:
      built-modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Detect changed modules
        id: detect
        run: |
          MSA_MODULES="user stadium ticketing payment resale"
          SHARED_MODULES="common integration core"

          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -oP '^[^/]+' | sort -u)
          echo "변경된 디렉토리: $CHANGED"

          # common/integration/core 변경 시 전체 MSA 모듈 빌드
          BUILD_ALL=false
          for shared in $SHARED_MODULES; do
            if echo "$CHANGED" | grep -qx "$shared"; then
              BUILD_ALL=true
              echo "공유 모듈 $shared 변경 감지 — 전체 MSA 모듈 빌드"
              break
            fi
          done

          if [ "$BUILD_ALL" = true ]; then
            echo "modules=$MSA_MODULES" >> "$GITHUB_OUTPUT"
          else
            TARGETS=""
            for module in $MSA_MODULES; do
              if echo "$CHANGED" | grep -qx "$module"; then
                TARGETS="$TARGETS $module"
              fi
            done
            TARGETS=$(echo "$TARGETS" | xargs)
            echo "modules=$TARGETS" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.detect.outputs.modules != ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push MSA images
        if: steps.detect.outputs.modules != ''
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          MODULES="${{ steps.detect.outputs.modules }}"
          SHORT_SHA=${GITHUB_SHA::7}
          TAG="dev-${{ github.run_number }}-${SHORT_SHA}"

          echo "빌드 대상 모듈: $MODULES"
          echo "이미지 태그: $TAG"

          for MODULE in $MODULES; do
            REPO="goti-${MODULE}"
            IMAGE="${ECR_REGISTRY}/${REPO}:${TAG}"

            # 이미 존재하는 이미지 스킵
            if aws ecr describe-images --repository-name "${REPO}" --image-ids imageTag="${TAG}" > /dev/null 2>&1; then
              echo "--- ${MODULE}: 이미지 ${TAG} 이미 존재 — 스킵 ---"
              continue
            fi

            echo "--- ${MODULE} 빌드 시작 ---"
            docker buildx build \
              --build-arg MODULE="${MODULE}" \
              --cache-from type=gha,scope="${MODULE}" \
              --cache-to type=gha,mode=max,scope="${MODULE}" \
              --tag "${IMAGE}" \
              --push \
              .
            echo "--- ${MODULE} 빌드 완료: ${IMAGE} ---"
          done

  # 빌드된 MSA 모듈만 Goti-k8s values.yaml 태그 업데이트
  update-k8s-image-tag:
    needs: [msa-image-build]
    if: needs.msa-image-build.outputs.built-modules != ''
    runs-on: ubuntu-latest
    steps:
      - name: Update Goti-k8s image tags
        env:
          GH_TOKEN: ${{ secrets.GOTI_K8S_DISPATCH_TOKEN }}
        run: |
          TAG="dev-${{ github.run_number }}-${GITHUB_SHA::7}"
          REPO="Team-Ikujo/Goti-k8s"
          BRANCH="main"
          BUILT_MODULES="${{ needs.msa-image-build.outputs.built-modules }}"

          echo "이미지 태그: $TAG"
          echo "빌드된 모듈: $BUILT_MODULES"

          for MODULE in $BUILT_MODULES; do
            FILE_PATH="environments/dev/goti-${MODULE}/values.yaml"

            # 현재 파일 내용 + SHA 가져오기
            RESPONSE=$(gh api "repos/${REPO}/contents/${FILE_PATH}?ref=${BRANCH}" 2>/dev/null) || {
              echo "⚠️ ${FILE_PATH} 조회 실패 — 스킵"
              continue
            }

            FILE_SHA=$(echo "$RESPONSE" | jq -r '.sha')
            CONTENT_B64=$(echo "$RESPONSE" | jq -r '.content')
            CURRENT=$(echo "$CONTENT_B64" | base64 -d)

            # 현재 태그 확인
            CURRENT_TAG=$(echo "$CURRENT" | grep -oP 'tag:\s*"\K[^"]+')
            if [ "$CURRENT_TAG" = "$TAG" ]; then
              echo "✓ goti-${MODULE}: 이미 최신 ($TAG)"
              continue
            fi

            # 태그 교체
            UPDATED=$(echo "$CURRENT" | sed "s|tag: \"${CURRENT_TAG}\"|tag: \"${TAG}\"|")
            NEW_B64=$(echo "$UPDATED" | base64 -w 0)

            # 커밋
            gh api "repos/${REPO}/contents/${FILE_PATH}" \
              -X PUT \
              -f message="[CHORE] goti-${MODULE} 이미지 태그 업데이트: ${TAG}" \
              -f content="${NEW_B64}" \
              -f sha="${FILE_SHA}" \
              -f branch="${BRANCH}" \
              --silent

            echo "✓ goti-${MODULE}: ${CURRENT_TAG} → ${TAG}"
          done
