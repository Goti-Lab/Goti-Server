name: CICD (prod)

on:
  push:
    branches: [deploy/prod]
  workflow_dispatch:
    inputs:
      services:
        description: "빌드할 서비스 (쉼표 구분, 비우면 변경 감지 자동). 예: user,stadium"
        required: false
        default: ""

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  HARBOR_PROJECT: prod

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: set-matrix
        run: |
          SERVICES="user stadium ticketing payment resale"

          # workflow_dispatch에서 수동 지정한 경우
          if [ -n "${{ github.event.inputs.services }}" ]; then
            INPUT="${{ github.event.inputs.services }}"
            TARGETS=$(echo "$INPUT" | tr ',' '\n' | xargs)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            TARGETS=""
            for svc in $SERVICES; do
              if echo "$CHANGED" | grep -q "^${svc}/"; then
                TARGETS="$TARGETS $svc"
              fi
            done
            # core/common/integration 변경 시 전체 빌드
            if echo "$CHANGED" | grep -qE "^(core|common|integration)/"; then
              TARGETS="$SERVICES"
            fi
            TARGETS=$(echo "$TARGETS" | xargs)
          fi

          if [ -z "$TARGETS" ]; then
            echo "변경된 서비스 없음 — 빌드 스킵"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            echo "빌드 대상: $TARGETS"
            JSON=$(echo "$TARGETS" | tr ' ' '\n' | jq -R '{service: .}' | jq -sc '{include: .}')
            echo "matrix=${JSON}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '{"include":[]}' }}
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          IMAGE_TAG="prod-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: MODULE=${{ matrix.service }}
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/goti-${{ matrix.service }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  update-k8s:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    if: ${{ needs.detect-changes.outputs.matrix != '{"include":[]}' }}
    steps:
      - name: Checkout Goti-k8s
        uses: actions/checkout@v4
        with:
          repository: Team-Ikujo/Goti-k8s
          token: ${{ secrets.GH_PAT }}
          ref: main

      - name: Update prod image tags
        run: |
          IMAGE_TAG="prod-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          SERVICES=$(echo '${{ needs.detect-changes.outputs.matrix }}' | jq -r '.include[].service' | tr '\n' ' ')

          for svc in $SERVICES; do
            FILE="environments/prod/goti-${svc}/values.yaml"
            NEW_REPO="${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/goti-${svc}"
            sed -i "s|repository: \".*\"|repository: \"${NEW_REPO}\"|" "$FILE"
            sed -i "s|tag: \".*\"|tag: \"${IMAGE_TAG}\"|" "$FILE"
            sed -i "s|name: ecr-creds|name: harbor-creds|" "$FILE"
            echo "Updated ${FILE} → ${NEW_REPO}:${IMAGE_TAG}"
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_PAT }}
          branch: chore/prod-image-prod-${{ github.run_number }}-${{ github.sha }}
          commit-message: "[CHORE] prod 이미지 태그 업데이트: prod-${{ github.run_number }}-${{ github.sha }}"
          title: "[CHORE] prod 이미지 태그 업데이트: prod-${{ github.run_number }}-${{ github.sha }}"
          body: |
            ## 변경 사항
            - 이미지 태그: `prod-${{ github.run_number }}-${{ github.sha }}`
            - 레지스트리: `${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/`
            - 업데이트된 서비스: `${{ needs.detect-changes.outputs.matrix }}`

            ## 트리거
            - 브랜치: `${{ github.ref_name }}`
            - 커밋: ${{ github.sha }}
            - 워크플로우: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          base: main
          labels: chore,prod