name: Develop PR

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'

concurrency:
  group: develop-pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test-and-build-msa:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: ${{ secrets.DATASOURCE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DATASOURCE_PASSWORD }}
          POSTGRES_DB: ${{ vars.DATABASE_NAME || 'goti_local' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run all tests
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ vars.DATABASE_NAME || 'goti_local' }}
          DATASOURCE_USERNAME: ${{ secrets.DATASOURCE_USERNAME }}
          DATASOURCE_PASSWORD: ${{ secrets.DATASOURCE_PASSWORD }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ACCESS_TIME: ${{ secrets.JWT_ACCESS_TIME }}
          JWT_REFRESH_TIME: ${{ secrets.JWT_REFRESH_TIME }}
          JWT_SOCIAL_VERIFY_TIME: ${{ secrets.JWT_SOCIAL_VERIFY_TIME }}
          KAKAO_CLIENT: ${{ secrets.KAKAO_CLIENT }}
          KAKAO_SECRET: ${{ secrets.KAKAO_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          NAVER_CLIENT: ${{ secrets.NAVER_CLIENT }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}
          GOOGLE_CLIENT: ${{ secrets.GOOGLE_CLIENT }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          SMS_API_DOMAIN: ${{ vars.SMS_API_DOMAIN }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_API_SECRET: ${{ secrets.SMS_API_SECRET }}
          SMS_API_SENDER: ${{ secrets.SMS_API_SENDER }}
          QUEUE_TOKEN_SECRET: ci-queue-token-secret-key-minimum-32-chars
          CLOUDFLARE_TURNSTILE_SECRET: ci-turnstile-secret

        run: ./gradlew test --no-daemon

      - name: Build all MSA bootJars
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ vars.DATABASE_NAME || 'goti_local' }}
          DATASOURCE_USERNAME: ${{ secrets.DATASOURCE_USERNAME }}
          DATASOURCE_PASSWORD: ${{ secrets.DATASOURCE_PASSWORD }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ACCESS_TIME: ${{ secrets.JWT_ACCESS_TIME }}
          JWT_REFRESH_TIME: ${{ secrets.JWT_REFRESH_TIME }}
          JWT_SOCIAL_VERIFY_TIME: ${{ secrets.JWT_SOCIAL_VERIFY_TIME }}
          KAKAO_CLIENT: ${{ secrets.KAKAO_CLIENT }}
          KAKAO_SECRET: ${{ secrets.KAKAO_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          NAVER_CLIENT: ${{ secrets.NAVER_CLIENT }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}
          GOOGLE_CLIENT: ${{ secrets.GOOGLE_CLIENT }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          SMS_API_DOMAIN: ${{ vars.SMS_API_DOMAIN}}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_API_SECRET: ${{ secrets.SMS_API_SECRET }}
          SMS_API_SENDER: ${{ secrets.SMS_API_SENDER }}
          QUEUE_TOKEN_SECRET: ci-queue-token-secret-key-minimum-32-chars
          CLOUDFLARE_TURNSTILE_SECRET: ci-turnstile-secret
        run: ./gradlew :user:bootJar :stadium:bootJar :ticketing:bootJar :payment:bootJar :resale:bootJar :queue:bootJar -Pmsa --no-daemon -x test

      - name: Upload test reports (build-and-test)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-develop-pr
          path: '**/build/reports/tests/'

  docker-build-msa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker build verification (all MSA modules)
        run: |
          MODULES="user stadium ticketing payment resale queue"
          echo "MSA 빌드 검증 대상: $MODULES"

          for MODULE in $MODULES; do
            echo "--- ${MODULE} 빌드 검증 ---"
            DOCKER_BUILDKIT=1 docker build \
              --build-arg MODULE="${MODULE}" \
              -t "goti-${MODULE}:ci-test" \
              .
            echo "--- ${MODULE} 빌드 검증 완료 ---"
          done
