name: CI

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: ${{ secrets.DATASOURCE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DATASOURCE_PASSWORD }}
          POSTGRES_DB: ${{ vars.DATABASE_NAME || 'goti_local' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ vars.DATABASE_NAME || 'goti_local' }}
          DATASOURCE_USERNAME: ${{ secrets.DATASOURCE_USERNAME }}
          DATASOURCE_PASSWORD: ${{ secrets.DATASOURCE_PASSWORD }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ACCESS_TIME: ${{ secrets.JWT_ACCESS_TIME }}
          JWT_REFRESH_TIME: ${{ secrets.JWT_REFRESH_TIME }}
          KAKAO_CLIENT: ${{ secrets.KAKAO_CLIENT }}
          KAKAO_SECRET: ${{ secrets.KAKAO_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          NAVER_CLIENT: ${{ secrets.NAVER_CLIENT }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}
          GOOGLE_CLIENT: ${{ secrets.GOOGLE_CLIENT }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
        run: ./gradlew :api:bootJar --no-daemon -x test

      - name: Run tests for changed modules
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ vars.DATABASE_NAME || 'goti_local' }}
          DATASOURCE_USERNAME: ${{ secrets.DATASOURCE_USERNAME }}
          DATASOURCE_PASSWORD: ${{ secrets.DATASOURCE_PASSWORD }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ACCESS_TIME: ${{ secrets.JWT_ACCESS_TIME }}
          JWT_REFRESH_TIME: ${{ secrets.JWT_REFRESH_TIME }}
          KAKAO_CLIENT: ${{ secrets.KAKAO_CLIENT }}
          KAKAO_SECRET: ${{ secrets.KAKAO_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          NAVER_CLIENT: ${{ secrets.NAVER_CLIENT }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}
          GOOGLE_CLIENT: ${{ secrets.GOOGLE_CLIENT }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
        run: |
          MODULES="core common integration user stadium ticketing payment resale api"

          CHANGED=$(git diff --name-only origin/develop...HEAD | grep -oP '^[^/]+' | sort -u)

          TARGETS=""
          for module in $MODULES; do
            if echo "$CHANGED" | grep -qx "$module"; then
              TARGETS="$TARGETS :${module}:test"
            fi
          done

          if [ -z "$TARGETS" ]; then
            echo "변경된 모듈 없음 — 테스트 스킵"
          else
            echo "테스트 대상:$TARGETS"
            ./gradlew $TARGETS --no-daemon
          fi

      - name: Upload test reports (build-and-test)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-build-and-test
          path: '**/build/reports/tests/'

  full-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: ${{ secrets.DATASOURCE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DATASOURCE_PASSWORD }}
          POSTGRES_DB: ${{ vars.DATABASE_NAME || 'goti_local' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run all tests
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ vars.DATABASE_NAME || 'goti_local' }}
          DATASOURCE_USERNAME: ${{ secrets.DATASOURCE_USERNAME }}
          DATASOURCE_PASSWORD: ${{ secrets.DATASOURCE_PASSWORD }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ACCESS_TIME: ${{ secrets.JWT_ACCESS_TIME }}
          JWT_REFRESH_TIME: ${{ secrets.JWT_REFRESH_TIME }}
          KAKAO_CLIENT: ${{ secrets.KAKAO_CLIENT }}
          KAKAO_SECRET: ${{ secrets.KAKAO_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          NAVER_CLIENT: ${{ secrets.NAVER_CLIENT }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}
          GOOGLE_CLIENT: ${{ secrets.GOOGLE_CLIENT }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
        run: ./gradlew test --no-daemon

      - name: Upload test reports (full-test)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-full-test
          path: '**/build/reports/tests/'

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker build verification
        run: DOCKER_BUILDKIT=1 docker build -t goti-server:ci-test .