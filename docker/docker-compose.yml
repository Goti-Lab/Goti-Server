services:
  postgres:
    image: postgres:17-alpine
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: goti-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goti}
      POSTGRES_USER: ${POSTGRES_USER:-goti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goti1234}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goti}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: goti-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
