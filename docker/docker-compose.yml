services:
  postgres:
    image: postgres:17-alpine
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: goti-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goti}
      POSTGRES_USER: ${POSTGRES_USER:-goti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goti1234}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goti}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: goti-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  zookeeper:
    image: zookeeper:3.9.2
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: goti-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181

  kafka:
    image: apache/kafka:3.7.0
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: goti-kafka
    ports:
      - "9092:9092"
    environment:
      # 아파치 공식 이미지 설정 (KRaft 모드 겸용 가능하지만 Zookeeper 연결로 유지)
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    container_name: goti-kafka-ui
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

volumes:
  postgres-data:
  redis-data:
