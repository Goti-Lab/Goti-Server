services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: goti-server
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-goti}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-goti}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-goti1234}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped
