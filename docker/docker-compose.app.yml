services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: goti-server
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-goti}
      DATASOURCE_USERNAME: ${POSTGRES_USER:-goti}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-goti1234}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-key-minimum-32-chars-long}
      JWT_ACCESS_TIME: ${JWT_ACCESS_TIME:-3600000}
      JWT_REFRESH_TIME: ${JWT_REFRESH_TIME:-604800000}
      KAKAO_CLIENT: ${KAKAO_CLIENT:-not-set}
      KAKAO_SECRET: ${KAKAO_SECRET:-not-set}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:8080/callback}
      NAVER_CLIENT: ${NAVER_CLIENT:-not-set}
      NAVER_SECRET: ${NAVER_SECRET:-not-set}
      NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI:-http://localhost:8080/callback}
      GOOGLE_CLIENT: ${GOOGLE_CLIENT:-not-set}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-not-set}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/callback}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped
