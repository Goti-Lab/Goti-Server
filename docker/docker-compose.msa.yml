services:
  user:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: user
    container_name: goti-user
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: 8080
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-goti}?currentSchema=user_service
      DATASOURCE_USERNAME: ${POSTGRES_USER:-goti}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-goti1234}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-key-minimum-32-chars-long!!}
      JWT_ACCESS_TIME: ${JWT_ACCESS_TIME:-3600000}
      JWT_REFRESH_TIME: ${JWT_REFRESH_TIME:-604800000}
      KAKAO_CLIENT: ${KAKAO_CLIENT:-not-set}
      KAKAO_SECRET: ${KAKAO_SECRET:-not-set}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:8081/callback}
      NAVER_CLIENT: ${NAVER_CLIENT:-not-set}
      NAVER_SECRET: ${NAVER_SECRET:-not-set}
      NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI:-http://localhost:8081/callback}
      GOOGLE_CLIENT: ${GOOGLE_CLIENT:-not-set}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-not-set}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8081/callback}
      SMS_ENABLED: "true"
      SMS_API_KEY: ${SMS_API_KEY:-not-set}
      SMS_API_SECRET: ${SMS_API_SECRET:-not-set}
      SMS_API_SENDER: ${SMS_API_SENDER:-01000000000}
      SMS_API_DOMAIN: ${SMS_API_DOMAIN:-https://api.coolsms.co.kr}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

