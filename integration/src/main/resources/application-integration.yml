external:
  api:
    connect-timeout: 5
    read-timeout: 10

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT:not-set}
    client-secret: ${KAKAO_SECRET:not-set}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/callback}
    token-url: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
    user-info-url: ${KAKAO_USER_INFO_URL:https://kapi.kakao.com/v2/user/me}
  naver:
    client-id: ${NAVER_CLIENT:not-set}
    client-secret: ${NAVER_SECRET:not-set}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8080/callback}
    token-url: ${NAVER_TOKEN_URL:https://nid.naver.com/oauth2.0/token}
    user-info-url: ${NAVER_USER_INFO_URL:https://openapi.naver.com/v1/nid/me}
  google:
    client-id: ${GOOGLE_CLIENT:not-set}
    client-secret: ${GOOGLE_SECRET:not-set}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/callback}
    token-url: ${GOOGLE_TOKEN_URL:https://oauth2.googleapis.com/token}
    user-info-url: ${GOOGLE_USER_INFO_URL:https://www.googleapis.com/oauth2/v3/userinfo}

sms:
  api:
    enabled: ${SMS_ENABLED:false}
    key: ${SMS_API_KEY:}
    secret: ${SMS_API_SECRET:}
    sender: ${SMS_API_SENDER:}
    content: "[Goti] 인증번호 [{code}]를 입력해주세요."
    domain: ${SMS_API_DOMAIN:}