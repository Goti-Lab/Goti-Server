server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: goti-resale-service
  profiles:
    include:
      - integration
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      idle-timeout: 5000
      max-lifetime: 420000
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_schema: resale_service
        hbm2ddl.create_namespaces: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 500
        order-inserts: true
        order_updates: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  config:
    import:
      - optional:file:.env[.properties]

jwt:
  secret: ${JWT_SECRET_KEY}
  access-valid-time: ${JWT_ACCESS_TIME}
  refresh-valid-time: ${JWT_REFRESH_TIME}
  social-verify-valid-time: ${JWT_SOCIAL_VERIFY_TIME:300000}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

seat:
  hold-expiry:
    enabled: true
    fixed-delay-ms: 60000
    batch-size: 100

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]"

internal:
  ticketing:
    base-url: ${INTERNAL_TICKETING_BASE_URL:http://localhost:8080}
