server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: goti-user-service
  profiles:
    include:
      - integration
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      idle-timeout: 5000
      max-lifetime: 420000
      connection-timeout: 5000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_schema: user_service
        hbm2ddl.create_namespaces: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  config:
    import:
      - optional:file:.env[.properties]

jwt:
  secret: ${JWT_SECRET_KEY}
  rsa-private-key: ${JWT_RSA_PRIVATE_KEY:}
  rsa-public-key: ${JWT_RSA_PUBLIC_KEY:}
  access-valid-time: ${JWT_ACCESS_TIME}
  refresh-valid-time: ${JWT_REFRESH_TIME}
  social-verify-valid-time: ${JWT_SOCIAL_VERIFY_TIME:300000}

app:
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    refresh:
      name: ${REFRESH_COOKIE_NAME:refreshToken}
      path: ${REFRESH_REISSUE_PATH:/api/v1/auth/reissue}


management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-}]"
